version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: foresight-db
    environment:
      POSTGRES_USER: foresight_user
      POSTGRES_PASSWORD: foresight_password
      POSTGRES_DB: foresight_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
